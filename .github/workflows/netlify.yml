name: Test, deploy to Netlify, test production

# Runs on GitHub's servers, which can reach Netlify and Supabase.
# 1. test:    typecheck/build, lint, unit tests, E2E tests (fake Supabase)
# 2. deploy:  uploads the tested dist/ to the worker-tracker-farm Netlify site
#             (needs the NETLIFY_AUTH_TOKEN secret; skipped without it)
# 3. production: E2E tests against the live URL, plus the live OTP + RLS test against
#             the real Supabase project when the LIVE_* test-number secrets are set
on:
  push:
    branches: [claude/lucid-pasteur-m25bfh, main]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: e4f7b673-0025-4bd6-ab9d-1271c0455bf9
  PRODUCTION_URL: https://worker-tracker-farm.netlify.app/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E tests (fake Supabase)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      deploy_id: ${{ steps.deploy.outputs.deploy_id }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy dist/ to Netlify (production)
        id: deploy
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret is not set, so nothing was deployed."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx -y netlify-cli@27.11.2 deploy --prod --no-build --dir dist \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "GitHub Actions ${GITHUB_SHA::7}" --json > deploy.json
          cat deploy.json
          echo "deploy_id=$(jq -r '.deploy_id' deploy.json)" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Deployed $(jq -r '.deploy_id' deploy.json) to $(jq -r '.url' deploy.json)" >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://worker-tracker-farm.netlify.app/
      LIVE_PHONE_A: ${{ secrets.LIVE_PHONE_A }}
      LIVE_CODE_A: ${{ secrets.LIVE_CODE_A }}
      LIVE_PHONE_B: ${{ secrets.LIVE_PHONE_B }}
      LIVE_CODE_B: ${{ secrets.LIVE_CODE_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production serves this commit's build
        run: |
          html=$(curl -fsS "$PRODUCTION_URL")
          echo "$html" | head -20
          asset=$(echo "$html" | grep -o 'assets/index-[^"]*\.js' | head -1)
          curl -fsS "$PRODUCTION_URL$asset" | grep -q "verifyOtp" && echo "Live bundle contains phone OTP sign-in."
      - name: Supabase phone sign-in status (no SMS sent)
        run: |
          curl -fsS "https://gzvsjkbpuguttmsodoiy.supabase.co/auth/v1/settings" \
            -H "apikey: sb_publishable_yjMK8lx8oHVzu1Ju34C0Zw_BU3GXo5v" > settings.json
          jq '{phone: .external.phone, sms_provider, phone_autoconfirm, disable_signup}' settings.json | tee phone.json
          echo "Supabase phone sign-in: $(jq -c . phone.json)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.external.phone' settings.json)" != "true" ]; then
            echo "::warning::The Supabase Phone provider is switched off, so real users cannot sign in yet."
          fi
      - name: E2E tests against production (+ live OTP/RLS test when LIVE_* secrets are set)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-e2e-results
          path: test-results
          retention-days: 7
