name: Test, deploy to Netlify, test production

# Runs on GitHub's servers, which can reach Netlify and Supabase.
# 1. test:    typecheck/build, lint, unit tests, E2E tests (fake Supabase)
# 2. deploy:  uploads the tested dist/ to the worker-tracker-farm Netlify site
#             (needs the NETLIFY_AUTH_TOKEN secret; skipped without it)
# 3. production: checks the live site is this build and opens on the dashboard without login
on:
  push:
    branches: [claude/lucid-pasteur-m25bfh, main]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: e4f7b673-0025-4bd6-ab9d-1271c0455bf9
  PRODUCTION_URL: https://worker-tracker-farm.netlify.app/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E tests (fake Supabase)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      deploy_id: ${{ steps.deploy.outputs.deploy_id }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy dist/ to Netlify (production)
        id: deploy
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret is not set, so nothing was deployed."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx -y netlify-cli@27.11.2 deploy --prod --no-build --dir dist \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "GitHub Actions ${GITHUB_SHA::7}" --json > deploy.json
          cat deploy.json
          echo "deploy_id=$(jq -r '.deploy_id' deploy.json)" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Deployed $(jq -r '.deploy_id' deploy.json) to $(jq -r '.url' deploy.json)" >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://worker-tracker-farm.netlify.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production serves this commit's build (no login, no server keys)
        run: |
          html=$(curl -fsS "$PRODUCTION_URL")
          asset=$(echo "$html" | grep -o 'assets/index-[^"]*\.js' | head -1)
          curl -fsS "$PRODUCTION_URL$asset" > bundle.js
          grep -q "Welcome to your farm notebook" bundle.js && echo "Live bundle is the farm notebook."
          if grep -q "gzvsjkbpuguttmsodoiy" bundle.js; then echo "::error::Live bundle still contains Supabase keys"; exit 1; fi
          echo "No Supabase keys in the live bundle: the app opens without login."
      - name: E2E test against production (opens on the dashboard without login)
        run: npx playwright test local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-e2e-results
          path: test-results
          retention-days: 7
